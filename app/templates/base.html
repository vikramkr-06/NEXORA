<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}AuthApp{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<nav class="navbar">

    <a href="/" class="logo">
        Auth<span>App</span>
    </a>

    <div class="nav-links">

        {% if user %}
            <a href="/dashboard">Dashboard</a>
            <a href="/profile">Profile</a>

            <form
                method="post"
                action="/logout"
                style="display:inline"
            >
                <button class="btn btn-secondary">
                    Logout
                </button>
            </form>

        {% else %}

            <a href="/login">Login</a>

            <a
                href="/register"
                class="btn btn-primary"
            >
                Get Started
            </a>

        {% endif %}

    </div>

</nav>

{% block content %}
{% endblock %}

<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>
</html>
