{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}

<div class="auth-wrapper">

<div class="card">

<h1>Create account</h1>

<p class="muted">
    Join us today.
</p>

{% if error %}
<div class="alert alert-error">
    {{ error }}
</div>
{% endif %}

<form method="post">

<div class="form-group">
<label>Username</label>

<input
    name="username"
    minlength="3"
    maxlength="50"
    required
    placeholder="john123"
>
</div>

<div class="form-group">
<label>Email</label>

<input
    type="email"
    name="email"
    required
    placeholder="you@example.com"
>
</div>

<div class="form-group">
<label>Password</label>

<div class="password-wrap">

<input
    type="password"
    name="password"
    id="password"
    minlength="8"
    required
>

<button
    type="button"
    class="password-toggle"
    onclick="togglePassword('password')"
>
    👁
</button>

</div>
</div>

<div class="form-group">

<label>
    Confirm Password
</label>

<input
    type="password"
    name="confirm_password"
    required
>

</div>

<button
    class="btn btn-primary full"
    type="submit"
>
    Create Account
</button>

</form>

<p class="muted">
    Already have an account?
    <a href="/login">Login</a>
</p>

</div>

</div>

{% endblock %}
